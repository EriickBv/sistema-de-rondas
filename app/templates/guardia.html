<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ronda Segura Pro</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/guardia.css') }}">
</head>
<body>

    <div id="screen-login" class="screen active">
        <div class="login-header">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <h2>Identificación</h2>
            <p>Sistema Seguro de Rondas</p>
        </div>

        <div class="field">
            <label>RUT</label>
            <input type="text" id="rut-login" class="input" placeholder="12.345.678-9" 
                   oninput="formatearRut(this)" maxlength="12" autocomplete="username">
        </div>
        <div class="field">
            <label>Contraseña</label>
            <input type="password" id="pass-login" class="input" placeholder="••••••••" 
                   autocomplete="current-password" onkeydown="if(event.key==='Enter') hacerLogin()">
        </div>

        <button class="btn btn-primary" onclick="hacerLogin()">Ingresar al Sistema</button>
        <p id="error-login" class="error-msg"></p>
    </div>

    <div id="screen-app" class="screen">
        <header class="app-header">
            <div class="guard-info">
                <span class="label">Guardia de Turno</span>
                <span id="nombre-guardia" class="value">Cargando...</span>
            </div>
            <button class="btn-icon" onclick="cerrarSesion()" title="Cerrar Sesión">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </button>
        </header>

        <div class="target-card">
            <div class="target-label">Siguiente Punto:</div>
            <div id="objetivo" class="target-value">A la espera del primer escaneo...</div>
        </div>

        <div id="reader-container" class="reader-container" style="display:none">
            <div id="reader"></div>
        </div>

        <div class="action-buttons">
            <button id="btn-scan" class="btn btn-scan" onclick="iniciarScanner()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h4v4H4zM16 4h4v4h-4zM4 16h4v4H4zM12 12h.01"/><path d="M3 3h18v18H3z"/></svg>
                Escanear Punto
            </button>
            <button id="btn-skip" class="btn btn-outline" onclick="mostrarModalSaltar()">
                Saltar este punto
            </button>
        </div>

        <div id="status" class="log-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            <span>Listo para iniciar la ronda.</span>
        </div>
    </div>

    <div id="modal-observacion" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header success-header">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                <h3>Punto Detectado</h3>
            </div>
            <div class="modal-body">
                <label>¿Hay alguna novedad? (Opcional)</label>
                <textarea id="txt-observacion" class="input textarea" placeholder="Ej: Luz apagada, puerta forzada..."></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="confirmarEnvio()">Confirmar Reporte</button>
                <button class="btn btn-ghost" onclick="cancelarEnvio()">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="modal-saltar" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header warning-header">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                <h3>Saltar Punto</h3>
            </div>
            <div class="modal-body">
                <label>Describe el motivo obligatorio:</label>
                <textarea id="txt-motivo-salto" class="input textarea" placeholder="Ej: Puerta con candado, pasillo bloqueado..."></textarea>
            </div>
            <div class="modal-footer">
                <button id="btn-confirm-skip" class="btn btn-warning" onclick="confirmarSalto(event)">Reportar Salto</button>
                <button class="btn btn-ghost" onclick="cerrarModalSaltar()">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "/api";
        let scanner = null;
        let QR_TEMPORAL = null;

        // --- INICIO Y AUTH ---

        if (localStorage.getItem('token_guardia')) verificarEstadoCuenta();

        async function verificarEstadoCuenta() {
            try {
                const res = await authFetch(`${API_URL}/auth/validar_token`);
                if (res && res.ok) {
                    configurarInterfaz(localStorage.getItem('nombre_guardia'));
                }
            } catch (e) { cerrarSesion(); }
        }

        function configurarInterfaz(nombre) {
            document.getElementById('nombre-guardia').innerText = nombre;
            mostrarPantalla('screen-app');
        }

        function mostrarPantalla(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        async function authFetch(url, options = {}) {
            const token = localStorage.getItem('token_guardia');
            if (!options.headers) options.headers = {};
            options.headers['Authorization'] = token;
            const res = await fetch(url, options);
            if (res.status === 401) {
                alert("Sesión expirada. Ingresa nuevamente.");
                cerrarSesion();
                return null;
            }
            return res;
        }

        // --- LOGIN ---

        function formatearRut(input) {
            let actual = input.value.replace(/^0+/, "");
            if (actual.length > 1) {
                let clean = actual.replace(/\./g, "").replace(/-/g, "");
                let body = clean.slice(0, -1);
                let dv = clean.slice(-1);
                input.value = body.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + "-" + dv;
            }
        }

        async function hacerLogin() {
            const rut = document.getElementById('rut-login').value;
            const password = document.getElementById('pass-login').value;
            const err = document.getElementById('error-login');
            
            if (!rut || !password) {
                mostrarErrorLogin("Completa RUT y Contraseña.");
                return;
            }

            try {
                const res = await fetch(`${API_URL}/auth/login_guardia`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rut, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token_guardia', data.token);
                    localStorage.setItem('nombre_guardia', data.nombre);
                    configurarInterfaz(data.nombre);
                    // Limpieza de seguridad
                    document.getElementById('rut-login').value = '';
                    document.getElementById('pass-login').value = '';
                    err.style.display = 'none';
                } else {
                    mostrarErrorLogin(data.message);
                }
            } catch (e) {
                mostrarErrorLogin("Error de conexión.");
            }
        }

        function mostrarErrorLogin(msg) {
            const err = document.getElementById('error-login');
            err.innerText = msg;
            err.style.display = 'block';
        }

        function cerrarSesion() {
            localStorage.removeItem('token_guardia');
            localStorage.removeItem('nombre_guardia');
            mostrarPantalla('screen-login');
            if (scanner) scanner.clear();
            resetUIDespuesDeEscanear();
        }

        // --- SCANNER Y LÓGICA DE RONDAS ---

        function resetUIDespuesDeEscanear() {
            document.getElementById('btn-scan').style.display = 'flex';
            document.getElementById('btn-skip').style.display = 'flex';
            document.getElementById('reader-container').style.display = 'none';
        }

        function iniciarScanner() {
            document.getElementById('btn-scan').style.display = 'none';
            document.getElementById('btn-skip').style.display = 'none';
            document.getElementById('reader-container').style.display = 'block';

            if (!scanner) scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 }, false);
            scanner.render(onScan, () => {}); 
        }

        function onScan(qrCode) {
            scanner.clear();
            resetUIDespuesDeEscanear();
            QR_TEMPORAL = qrCode;
            document.getElementById('txt-observacion').value = "";
            document.getElementById('modal-observacion').style.display = 'flex';
        }

        function cancelarEnvio() {
            document.getElementById('modal-observacion').style.display = 'none';
            QR_TEMPORAL = null;
        }

        function confirmarEnvio() {
            const obs = document.getElementById('txt-observacion').value;
            document.getElementById('modal-observacion').style.display = 'none';
            
            setStatus('loading', 'Validando ubicación GPS...');

            if (!navigator.geolocation) {
                setStatus('error', 'Tu navegador no soporta GPS.');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                pos => enviarAlServidor(QR_TEMPORAL, pos.coords.latitude, pos.coords.longitude, obs),
                () => setStatus('error', 'Debes permitir el acceso al GPS.'),
                { enableHighAccuracy: true }
            );
        }

        async function enviarAlServidor(tokenQr, lat, long, obs) {
            try {
                const res = await authFetch(`${API_URL}/rondas/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token_qr: tokenQr, lat, long, observacion: obs })
                });
                if (!res) return;
                const data = await res.json();
                procesarRespuestaRonda(res.ok, data);
            } catch (e) {
                setStatus('error', 'Error de conexión al enviar datos.');
            }
        }

        // --- SALTOS DE PUNTO ---

        function mostrarModalSaltar() {
            document.getElementById('modal-saltar').style.display = 'flex';
            const area = document.getElementById('txt-motivo-salto');
            area.value = '';
            setTimeout(() => area.focus(), 100);
        }

        function cerrarModalSaltar() {
            document.getElementById('modal-saltar').style.display = 'none';
        }

        async function confirmarSalto(e) {
            const motivo = document.getElementById('txt-motivo-salto').value;
            if (!motivo.trim()) { alert("Describe el motivo."); return; }

            const btn = document.getElementById('btn-confirm-skip');
            const originalText = btn.innerText;
            btn.innerText = "Enviando..."; btn.disabled = true;

            try {
                const res = await authFetch(`${API_URL}/rondas/saltar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ motivo })
                });
                const data = await res.json();
                cerrarModalSaltar();
                procesarRespuestaRonda(res.ok, data);
            } catch (err) {
                alert("Error de conexión");
            } finally {
                btn.innerText = originalText; btn.disabled = false;
            }
        }

        // --- UTILIDADES DE INTERFAZ ---

        function procesarRespuestaRonda(exito, data) {
            if (exito) {
                const tipo = data.status === 'warning' ? 'warning' : 'success';
                setStatus(tipo, data.message);
                if (data.proximo_punto) {
                    document.getElementById('objetivo').innerText = data.proximo_punto;
                }
            } else {
                setStatus('error', data.message);
            }
        }

        function setStatus(type, msg) {
            const statusDiv = document.getElementById('status');
            const icons = {
                success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
                warning: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
                error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
                loading: '<svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2v4"/></svg>'
            };

            statusDiv.className = `log-box ${type}`;
            statusDiv.innerHTML = `${icons[type]} <span>${msg}</span>`;
        }
    </script>
</body>
</html>
