version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    command: gunicorn --workers 1 --threads 2 --bind 0.0.0.0:5000 run:app
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: